<!DOCTYPE html>
<html lang="ru" data-bs-theme="{{ current_user.theme }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <title>{{title}}</title>
</head>
<body>
<div style="margin-bottom: 30px; position: sticky; top: 0; z-index: 1000; background-color: dodgerblue;">
    <header>
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <h1>
                        <a href="/" style="text-decoration: none; color: white;">
                            <img src="static/img/logo.png" width="70px" height="70px">
                            Текстовые головоломки. Взгляд сквозь ребусы.
                        </a>
                    </h1>
                </div>
            </div>
        </div>
    </header>
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="d-flex flex-wrap justify-content-center gap-2 w-100">
                    {% if current_user.is_authenticated %}
                    <a class="btn btn-primary flex-grow-1" href="/profile">Профиль<i class="bi bi-person"></i></a>
                    <a class="btn btn-primary flex-grow-1" href="/my_puzzles">Мои головоломки<i
                            class="bi bi-lightbulb"></i></a>
                    <a class="btn btn-primary flex-grow-1" href="/create">Создать<i class="bi bi-plus-circle"></i></a>

                    <!-- Выпадающее меню -->
                    <div class="dropdown flex-grow-1">
                        <button class="btn btn-primary dropdown-toggle w-100" type="button" data-bs-toggle="dropdown">
                            Решать<i class="bi bi-puzzle"></i>
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="/all_puzzles">Показать всё</a></li>
                            <li><a class="dropdown-item" href="/all_not_solved_puzzles">Показать всё, что не решено</a>
                            </li>
                            <li><a class="dropdown-item" href="/all_solved_puzzles">Показать всё, что решено</a></li>
                        </ul>
                    </div>

                    <a class="btn btn-primary flex-grow-1" href="/logout">Выйти<i class="bi bi-box-arrow-left"></i></a>
                    {% else %}
                    <a class="btn btn-primary flex-grow-1" href="/register">Зарегистрироваться</a>
                    <a class="btn btn-primary flex-grow-1" href="/login">Войти<i
                            class="bi bi-box-arrow-in-right"></i></a>
                    {% endif %}
                </div>
            </div>
        </nav>
    </div>
</div>
{%block content %} {% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
      var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
      var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
        return new bootstrap.Popover(popoverTriggerEl);
      });
    });
</script>
</body>
</html>
