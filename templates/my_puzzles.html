<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Мои головоломки</title>
    <style>
        .card-body a.btn {margin: 2px;}
        .card {margin: 5px;}
    </style>
</head>
<body>
{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="row justify-content-center">
        {% for item in puzzles %}
        <div class="col-md-4 col-sm-6 col-12 mb-4 card">
            <img src="static/img/rebuses/{{ item.id }}.png" alt="rebus" class="card-img-top">
            <div class="card-body">
                <h2 class="card-title">Головоломка #{{ item.id }}</h2>
                {% if item in user.solved_puzzles %}
                <a href="/solve/{{ item.id }}" class="btn btn-secondary">Смотреть <i class="bi bi-eye"></i></a>
                {% else %}
                <a href="/solve/{{ item.id }}" class="btn btn-success">Решать <i class="bi bi-puzzle"></i></a>
                {% endif %}
                <a href="/edit/{{ item.id }}" class="btn btn-warning">Изменить <i class="bi bi-pencil-square"></i></a>
                <a href="/delete/{{ item.id }}" class="btn btn-danger">Удалить <i class="bi bi-trash3"></i></a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
</body>
</html>
